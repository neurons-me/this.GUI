name: Deploy this.gui Docs

on:
  push:
    branches: [main]
    paths:
      - "Typescript/typedocs/**"
      - "Typescript/src/**"
      - "Typescript/typedoc.json"
      - "storybook/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Install from repo root — avoids Typescript/package.json workspace:* deps
      # that npm cannot resolve (workspace: is pnpm-only syntax).
      - name: Install VitePress
        run: npm install --no-save vitepress vue

      # Source .md and built .html live side by side in Typescript/typedocs/ —
      # outDir: '.' + emptyOutDir: false in .vitepress/config.ts builds in place.
      - name: Build VitePress
        run: npx vitepress build Typescript/typedocs
        env:
          VITEPRESS_BASE: /GUI/Typescript/typedocs/

      - name: Add .nojekyll to typedocs
        run: mkdir -p Typescript/typedocs && touch Typescript/typedocs/.nojekyll

      # Deploy VitePress output to gh-pages under Typescript/typedocs/
      - name: Deploy VitePress to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./Typescript/typedocs
          destination_dir: Typescript/typedocs
          keep_files: true

      # Storybook is committed at storybook/ and served directly
      # by Jekyll from the main branch — no separate deploy needed.
