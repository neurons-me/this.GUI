name: Deploy this.gui Docs

on:
  push:
    branches: [main]
    paths:
      - "Typescript/docs/**"
      - "Typescript/src/**"
      - "Typescript/typedoc.json"
      - "docs/storybook/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Install VitePress from repo root — avoids Typescript/package.json workspace:* deps.
      - name: Install VitePress
        run: npm install --no-save vitepress

      - name: Build VitePress
        run: npx vitepress build Typescript/docs
        env:
          VITEPRESS_BASE: /GUI/Typescript/typedocs/

      - name: Add .nojekyll to typedocs
        run: mkdir -p Typescript/typedocs && touch Typescript/typedocs/.nojekyll

      # Deploy VitePress output to gh-pages under Typescript/typedocs/
      - name: Deploy VitePress to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./Typescript/typedocs
          destination_dir: Typescript/typedocs
          keep_files: true

      # Deploy Storybook build to gh-pages under storybook/
      - name: Add .nojekyll to storybook
        run: touch docs/storybook/.nojekyll

      - name: Deploy Storybook to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/storybook
          destination_dir: storybook
          keep_files: true
