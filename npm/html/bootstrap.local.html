<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="https://res.cloudinary.com/dkwnxf6gm/image/upload/v1761276578/this.gui.npm.png" />
    <link rel="stylesheet" href="../dist/styles.css" />
    <title>.GUI - Local Bootstrap (.me + this.GUI)</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Local React globals -->
    <script src="../node_modules/react/umd/react.development.js"></script>
    <script src="../node_modules/react-dom/umd/react-dom.development.js"></script>
    <!-- Local UMD bundles -->
    <script src="../dist/this.gui.umd.js"></script>
    <script src="../../../.me/npm/dist/me.umd.js"></script>

    <script>
      (function () {
        const GUI = window.GUI;
        const Me = window.Me;
        const AppRouter = GUI?.Router;
        const RunMe = GUI?.RunMe;
        const root = document.getElementById('root');
        if (!GUI || typeof GUI.mount !== 'function') {
          throw new Error('[bootstrap.local] window.GUI.mount is missing. Build this.GUI first.');
        }
        if (typeof AppRouter !== 'function') {
          throw new Error('[bootstrap.local] window.GUI.Router is missing. Rebuild this.GUI core bundle.');
        }
        if (typeof RunMe !== 'function') {
          throw new Error('[bootstrap.local] window.GUI.RunMe is missing. Rebuild this.GUI core bundle.');
        }
        if (!Me) {
          throw new Error('[bootstrap.local] window.Me is missing. Build this.me first.');
        }

        const me = new Me();
        me.public.profile.status('idle');
        me.public.shops[123].name('Shop 123');
        me.public.shops[123].price(42);
        me.public.shops[123].visited(0);
        me.public.docs.sample('This is a wildcard route demo.');
        const toDotPath = (value) => String(value || '').replace(/\//g, '.').replace(/^\.+/, '');
        // Runtime bridge based on core RunMe + local adapters (dot-path + rerender hook)
        const baseRuntime = RunMe(me);
        const runtime = {
          ...baseRuntime,
          resolve(expr, ctx, meta) {
            if (typeof expr === 'string' && expr.startsWith('me/')) {
              const dotPath = toDotPath(expr.slice(3));
              // Prefer direct callable runtime when available.
              if (typeof me === 'function') return me(dotPath);
              if (typeof me.get === 'function') return me.get(dotPath);
              if (typeof me.readPath === 'function') return me.readPath(dotPath.split('.'));
              const converted = `me/${dotPath}`;
              return baseRuntime.resolve ? baseRuntime.resolve(converted, ctx, meta) : converted;
            }
            return baseRuntime.resolve ? baseRuntime.resolve(expr, ctx, meta) : expr;
          },
          action(expression, ctx, meta) {
            let expr = String(expression ?? '').trim();
            if (expr.startsWith('me/')) {
              const eq = expr.indexOf('=');
              if (eq >= 0) {
                const lhs = expr.slice(0, eq).trim();
                const rhs = expr.slice(eq + 1);
                expr = `${toDotPath(lhs.slice(3))} =${rhs}`;
              } else {
                expr = toDotPath(expr.slice(3));
              }
            }
            const baseFn = baseRuntime.action
              ? baseRuntime.action(expr, ctx, meta)
              : () => {};
            return function (...args) {
              const result = baseFn(...args);
              rerender();
              return result;
            };
          },
        };
        const router = new AppRouter({ runtime });
        let lastPath = '/dashboard';
        let lastCtx = {};

        function rerender() {
          router.navigate(lastPath, { push: false, ctx: lastCtx });
        }

        router.set('/dashboard', () => ({
          type: 'Page',
          props: {
            title: '.GUI Local + .me Runtime',
            subtitle: 'Dashboard route (exact match).',
          },
          children: [
            {
              type: 'Paper',
              props: { sx: { p: 2, borderRadius: 2, mt: 2 } },
              children: [
                { type: 'Typography', props: { variant: 'body1', sx: { mb: 1, fontWeight: 700 } }, children: ['Current status'] },
                { type: 'Typography', props: { variant: 'body2', children: { $expr: 'me/public/profile/status' } } },
              ],
            },
            {
              type: 'Box',
              props: { sx: { mt: 2, display: 'flex', gap: 1, flexWrap: 'wrap' } },
              children: [
                { type: 'Button', props: { variant: 'contained', color: 'success', label: 'Set sent', onClick: { $action: "me/public/profile/status = 'sent'" } } },
                { type: 'Button', props: { variant: 'outlined', color: 'warning', label: 'Set draft', onClick: { $action: "me/public/profile/status = 'draft'" } } },
                { type: 'Button', props: { variant: 'text', color: 'info', label: 'Go /shop/123', onClick: () => router.navigate('/shop/123') } },
              ],
            },
          ],
        }));
        router.set('/', () => router.resolve('/dashboard'));

        router.set('/shop/:id', ({ ctx }) => ({
          type: 'Page',
          props: {
            title: { $expr: 'me/public/shops[{{params.id}}].name' },
            subtitle: `Dynamic route shop id=${ctx?.params?.id || 'n/a'}`,
          },
          children: [
            {
              type: 'Paper',
              props: { sx: { p: 2, borderRadius: 2, mt: 2 } },
              children: [
                { type: 'Typography', props: { variant: 'body2' }, children: ['Price'] },
                { type: 'Typography', props: { variant: 'h6', children: { $expr: 'me/public/shops[{{params.id}}].price' } } },
                { type: 'Typography', props: { variant: 'body2', sx: { mt: 1 } }, children: ['Visited flag'] },
                { type: 'Typography', props: { variant: 'body2', children: { $expr: 'me/public/shops[{{params.id}}].visited' } } },
              ],
            },
            {
              type: 'Box',
              props: { sx: { mt: 2, display: 'flex', gap: 1 } },
              children: [
                { type: 'Button', props: { variant: 'contained', label: 'Mark visited', onClick: { $action: "me/public/shops[{{params.id}}].visited = 1" } } },
                { type: 'Button', props: { variant: 'outlined', label: 'Back /dashboard', onClick: () => router.navigate('/dashboard') } },
              ],
            },
          ],
        }));

        router.set('/docs/*', ({ ctx }) => ({
          type: 'Page',
          props: { title: 'Wildcard Route', subtitle: `wildcard=${ctx?.wildcard || ''}` },
          children: [
            {
              type: 'Typography',
              props: { variant: 'body2', children: { $expr: 'me/public/docs.{{wildcard}}' } },
            },
          ],
        }));

        const unlisten = router.onChange((spec, meta) => {
          lastPath = meta.path;
          lastCtx = meta.ctx || {};
          GUI.mount(spec, root, { runtime, ctx: meta.ctx, showUnknown: true, inspectorEnabled: true });
        });

        const rawPath = window.location.pathname || '/dashboard';
        const initialPath =
          (window.location.protocol === 'file:' || /\.html$/i.test(rawPath))
            ? '/dashboard'
            : rawPath;
        router.navigate(initialPath, { push: false }).catch(() => router.navigate('/dashboard', { push: false }));

        window.addEventListener('beforeunload', () => {
          try { unlisten(); } catch {}
          try { router.destroy?.(); } catch {}
        });
      })();
    </script>
  </body>
</html>
