<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>.GUI Bootstrap</title>
</head>
<body>
<div id="root"></div>
<!--Load...
 ▗▄▄▖▗▖ ▗▖▗▄▄▄▖
▐▌   ▐▌ ▐▌  █  
▐▌▝▜▌▐▌ ▐▌  █  
▝▚▄▞▘▝▚▄▞▘▗▄█▄▖ -->   
<script
  src="/this/GUI/npm/dist/this.gui.bootstrap.umd.js"
  crossorigin="anonymous"></script>
<!--load...
▄ ▄▄▄▄  ▗▞▀▚▖
  █ █ █ ▐▛▀▀▘
  █   █ ▝▚▄▄▖ -->
<script
  src="/this/.me/npm/dist/me.umd.js"
  crossorigin="anonymous"></script>
<script type="module">
  import { registerGuiRoutes } from "/this/GUI/router.js";
  import { detectGuiBasePath } from "/this/GUI/data/navigation.js";
  import { installVirtualPatterns } from "/this/GUI/data/virtual-patterns.js";
  const root = document.getElementById("root");
  window.__THIS_GUI_DISABLE_AUTOBOOT__ = true;
  try {
    const GUI =
      typeof window.bootGUI === "function"
        ? await window.bootGUI()
        : window.GUI;
    if (!GUI || typeof GUI.startApp !== "function") {
      throw new Error("GUI startApp missing");
    }
    await GUI.startApp({
      root,
      basePath: detectGuiBasePath(),
      createMe: () => new Me(),
      registerRoutes: registerGuiRoutes,
      install: [installVirtualPatterns],
      gui: GUI,
    });
  } catch (error) {
    if (root) {
      root.textContent = error && error.message ? error.message : String(error);
    }
  }
</script>
  </body>
</html>
