<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>.GUI</title>
<link rel="icon" href="https://res.cloudinary.com/dkwnxf6gm/image/upload/v1761276578/this.gui.npm.png" />
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--mui-palette-background-default, Canvas);
    color: var(--mui-palette-text-primary, CanvasText);
    font: 13px/1.35 var(--mui-font-family, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif);
  }

  .gui-leftbar-logo {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    min-height: 60px;
    justify-content: center;
    padding: 6px 10px;
    text-decoration: none;
    color: inherit;
    box-sizing: border-box;
  }

  .gui-leftbar-logo-label {
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .gui-leftbar-rail .gui-leftbar-logo {
    justify-content: center;
    padding: 6px 6px;
  }

  .gui-leftbar-rail .gui-leftbar-logo-label {
    display: none;
  }

  .gui-leftbar-expanded .gui-leftbar-logo {
    justify-content: flex-start;
  }

  .gui-leftbar-footer-logo {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 44px;
    text-decoration: none;
    color: inherit;
    box-sizing: border-box;
    opacity: 0.72;
    transition: opacity 160ms ease;
  }

  .gui-leftbar-footer-logo:hover {
    opacity: 1;
  }

  body.runtime-collapsed #runtime-controls {
    transform: translateY(-100%);
    opacity: 0;
    pointer-events: none;
    max-height: 0;
    overflow: hidden;
    padding-top: 0;
    padding-bottom: 0;
    border-bottom-width: 0;
  }

  #runtime-controls {
    position: sticky;
    top: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 8px 12px;
    align-items: center;
    padding: 10px 14px;
    background: color-mix(in srgb, var(--mui-palette-background-paper, Canvas) 90%, transparent);
    border-bottom: 1px solid var(--mui-palette-divider, #ddd);
    backdrop-filter: blur(10px);
    z-index: 10;
    transition: transform 200ms ease, opacity 200ms ease;
    margin-left: var(--gui-inset-left, 0px);
    margin-right: var(--gui-inset-right, 0px);
    width: calc(100% - var(--gui-inset-left, 0px) - var(--gui-inset-right, 0px));
  }

  #runtime-controls .runtime-group {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 6px;
    min-width: 0;
  }

  #runtime-controls .runtime-control {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 6px;
    min-width: 0;
    padding: 6px 8px;
    border: 1px solid var(--mui-palette-divider, #eee);
    border-radius: 10px;
    background: color-mix(in srgb, var(--mui-palette-background-paper, Canvas) 70%, transparent);
  }

  #runtime-controls .runtime-control-row {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
  }

  #runtime-controls label {
    font-size: 10px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--mui-palette-text-secondary, #666);
    white-space: nowrap;
  }

  #runtime-controls select,
  #runtime-controls button {
    border: 1px solid var(--mui-palette-divider, #ccc);
    border-radius: 9px;
    background: var(--mui-palette-background-paper, #fff);
    color: var(--mui-palette-text-primary, #111);
    padding: 6px 9px;
    font: inherit;
    min-height: 32px;
  }

  #runtime-controls .runtime-action {
    margin-left: auto;
    align-self: center;
    border-radius: 999px;
    min-width: 32px;
    width: 32px;
    height: 32px;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    line-height: 1;
  }

  body:not(.runtime-ready) #runtime-controls-toggle {
    display: none;
  }

  #runtime-controls .runtime-local-prompt,
  #runtime-controls .runtime-local-editor {
    display: none;
    flex: 1 1 100%;
    gap: 8px;
    align-items: center;
    padding: 8px 10px;
    border-radius: 10px;
    border: 1px solid var(--mui-palette-divider, #ddd);
    background: color-mix(in srgb, var(--mui-palette-background-paper, Canvas) 88%, transparent);
  }

  #runtime-controls .runtime-local-prompt.visible,
  #runtime-controls .runtime-local-editor.visible {
    display: flex;
    flex-wrap: wrap;
  }

  #runtime-controls .runtime-local-prompt span {
    font-size: 11px;
    color: var(--mui-palette-text-secondary, #666);
  }

  #runtime-controls .runtime-local-prompt button,
  #runtime-controls .runtime-local-editor button {
    border: 1px solid var(--mui-palette-divider, #ccc);
    border-radius: 9px;
    background: var(--mui-palette-background-paper, #fff);
    color: var(--mui-palette-text-primary, #111);
    padding: 6px 10px;
    font: inherit;
    min-height: 30px;
  }

  #runtime-controls .runtime-local-editor label {
    font-size: 10px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--mui-palette-text-secondary, #666);
  }

  #runtime-controls .runtime-local-editor input {
    border: 1px solid var(--mui-palette-divider, #ccc);
    border-radius: 9px;
    background: var(--mui-palette-background-paper, #fff);
    color: var(--mui-palette-text-primary, #111);
    padding: 6px 9px;
    font: inherit;
    min-height: 30px;
    min-width: 220px;
  }

  .runtime-status-state {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    line-height: 1.2;
  }

  .runtime-status-state::before {
    content: '';
    width: 8px;
    height: 8px;
    border-radius: 999px;
    background: currentColor;
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--mui-palette-divider, #ddd) 60%, transparent);
  }

  .runtime-status-state.pending { color: var(--mui-palette-warning-main, #a2750a); }
  .runtime-status-state.on { color: var(--mui-palette-success-main, #0c7a43); }
  .runtime-status-state.off { color: var(--mui-palette-error-main, #a12c2c); }

  .runtime-status-url {
    font-size: 10px;
    color: var(--mui-palette-text-secondary, #777);
    line-height: 1.25;
    max-width: 100%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .runtime-status-url .url-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .runtime-status-url .url-text {
    flex: 1;
    min-width: 0;
    font-size: 9px;
    letter-spacing: 0.02em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--mui-palette-text-secondary, #777);
  }

  .runtime-status-url .url-toggle {
    border: 0;
    padding: 0 2px;
    font-size: 9px;
    background: transparent;
    cursor: pointer;
    color: var(--mui-palette-primary-main, #1f5fff);
  }
</style>
</head>
<body>
<div id="runtime-controls">
  <div class="runtime-group runtime-control" id="runtime-gui-box">
    <div class="runtime-control-row">
      <label for="gui-source">GUI</label>
      <select id="gui-source">
        <option value="local">Local</option>
        <option value="stable" selected>CDN Stable</option>
        <option value="latest">CDN Latest</option>
      </select>
      <div id="runtime-gui-state" class="runtime-status-state pending" title="-">pending</div>
    </div>
    <div id="runtime-gui-url" class="runtime-status-url">
      <span class="url-row">
        <span class="url-text">-</span>
        <button class="url-toggle" id="runtime-gui-toggle" type="button" hidden>expand</button>
      </span>
    </div>
  </div>
  <div class="runtime-local-prompt" id="runtime-local-prompt">
    <span>Local runtime not found. Skip to CDN or edit local paths.</span>
    <button type="button" id="runtime-local-skip">Skip</button>
    <button type="button" id="runtime-local-edit">Edit</button>
  </div>
  <div class="runtime-local-editor" id="runtime-local-editor">
    <label for="runtime-local-css">Local CSS</label>
    <input id="runtime-local-css" type="text" placeholder="../../this/GUI/npm/dist/styles.css" />
    <label for="runtime-local-js">Local JS</label>
    <input id="runtime-local-js" type="text" placeholder="../../this/GUI/npm/dist/this.gui.umd.js" />
    <button type="button" id="runtime-local-save">Save & Retry</button>
    <button type="button" id="runtime-local-cancel">Cancel</button>
  </div>
  <button class="runtime-action" id="runtime-controls-toggle" type="button" aria-label="Close runtime controls">×</button>
</div>
<div id="root"></div>
<script>
  (async function () {
    const SOURCE_STORAGE_KEY = 'gui.runtime.source.v1';
    const COLLAPSE_STORAGE_KEY = 'gui.runtime.collapsed.v1';
    const INSPECTOR_STORAGE_KEY = 'gui.runtime.inspector.v1';
    const ADMIN_VIEW_STORAGE_KEY = 'gui.runtime.admin.view.v1';
    const LOCAL_PATHS_KEY = 'gui.runtime.local.paths.v1';
    const defaults = { gui: 'stable' };
    const guiSelect = document.getElementById('gui-source');
    const toggleButton = document.getElementById('runtime-controls-toggle');
    const localPrompt = document.getElementById('runtime-local-prompt');
    const localEdit = document.getElementById('runtime-local-editor');
    const localSkip = document.getElementById('runtime-local-skip');
    const localEditBtn = document.getElementById('runtime-local-edit');
    const localCssInput = document.getElementById('runtime-local-css');
    const localJsInput = document.getElementById('runtime-local-js');
    const localSave = document.getElementById('runtime-local-save');
    const localCancel = document.getElementById('runtime-local-cancel');
    let rerender = () => {};
    const statusEls = {
      guiBox: document.getElementById('runtime-gui-box'),
      guiState: document.getElementById('runtime-gui-state'),
      guiUrl: document.getElementById('runtime-gui-url'),
      guiToggle: document.getElementById('runtime-gui-toggle'),
    };

    const LOCAL_CSS_DEFAULT = '../../this/GUI/npm/dist/styles.css';
    const LOCAL_JS_DEFAULT = '../../this/GUI/npm/dist/this.gui.umd.js';
    const STABLE_CSS = 'https://cdn.jsdelivr.net/npm/this.gui@stable/dist/styles.css';
    const STABLE_JS = 'https://cdn.jsdelivr.net/npm/this.gui@stable/dist/this.gui.bootstrap.umd.js';
    const LATEST_CSS = 'https://cdn.jsdelivr.net/npm/this.gui@latest/dist/styles.css';
    const LATEST_JS = 'https://cdn.jsdelivr.net/npm/this.gui@latest/dist/this.gui.bootstrap.umd.js';
    const REACT_CDN = 'https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js';
    const REACTDOM_CDN = 'https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js';
    const isHttp = window.location.protocol === 'http:' || window.location.protocol === 'https:';
    const allowLocal = !isHttp || window.location.protocol === 'file:';

    function readLocalPaths() {
      try {
        const raw = localStorage.getItem(LOCAL_PATHS_KEY);
        const parsed = raw ? JSON.parse(raw) : {};
        return {
          css: parsed && parsed.css ? String(parsed.css) : LOCAL_CSS_DEFAULT,
          js: parsed && parsed.js ? String(parsed.js) : LOCAL_JS_DEFAULT,
        };
      } catch {
        return { css: LOCAL_CSS_DEFAULT, js: LOCAL_JS_DEFAULT };
      }
    }

    function writeLocalPaths(next) {
      try {
        localStorage.setItem(LOCAL_PATHS_KEY, JSON.stringify(next));
      } catch {}
    }

    function resolveAssetUrls(source) {
      if (source === 'local') return allowLocal ? readLocalPaths() : { css: STABLE_CSS, js: STABLE_JS };
      if (source === 'latest') return { css: LATEST_CSS, js: LATEST_JS };
      return { css: STABLE_CSS, js: STABLE_JS };
    }

    function formatRuntimeDetail(version, url) {
      const shortUrl = String(url || '').replace(window.location.origin, '');
      return version ? ('v' + version + ' · ' + shortUrl) : shortUrl;
    }

    function setStatus(state, urls, version) {
      const boxEl = statusEls.guiBox;
      const stateEl = statusEls.guiState;
      const urlEl = statusEls.guiUrl;
      const toggleEl = statusEls.guiToggle;
      if (boxEl) {
        boxEl.classList.remove('state-pending', 'state-loaded', 'state-notfound');
        boxEl.classList.add('state-' + state);
      }
      if (stateEl) {
        const normalized = state === 'loaded' ? 'on' : state === 'notfound' ? 'off' : 'pending';
        stateEl.textContent = normalized === 'on' ? 'Loaded' : normalized === 'off' ? 'NotFound' : 'Pending';
        stateEl.className = 'runtime-status-state ' + normalized;
      }
      if (urlEl) {
        const cssUrl = urls && urls.css ? urls.css : '-';
        const jsUrl = urls && urls.js ? urls.js : '-';
        const detailText = [
          formatRuntimeDetail(version, cssUrl),
          formatRuntimeDetail(version, jsUrl),
        ].join('\n');
        const urlTextEl = urlEl.querySelector('.url-text') || urlEl;
        const full = detailText;
        const isLong = full.length > 42;
        const short = isLong ? `${full.slice(0, 16)}…${full.slice(-12)}` : full;
        urlTextEl.textContent = short;
        urlTextEl.title = full;
        urlTextEl.dataset.full = full;
        urlTextEl.dataset.short = short;
        urlTextEl.dataset.expanded = 'false';
        if (toggleEl) {
          toggleEl.hidden = !isLong;
          toggleEl.textContent = 'expand';
        }
      }
    }

    function bindToggle() {
      const urlEl = statusEls.guiUrl;
      const toggleEl = statusEls.guiToggle;
      if (!urlEl || !toggleEl) return;
      const urlTextEl = urlEl.querySelector('.url-text') || urlEl;
      toggleEl.addEventListener('click', () => {
        const expanded = urlTextEl.dataset.expanded === 'true';
        urlTextEl.textContent = expanded ? urlTextEl.dataset.short || '-' : urlTextEl.dataset.full || '-';
        urlTextEl.dataset.expanded = expanded ? 'false' : 'true';
        toggleEl.textContent = expanded ? 'expand' : 'collapse';
      });
    }

    const loadStyle = (href) => new Promise((resolve, reject) => {
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = href;
      if (/^https?:\/\//i.test(href)) {
        link.crossOrigin = 'anonymous';
      }
      link.onload = () => resolve(true);
      link.onerror = () => reject(new Error('style load failed: ' + href));
      document.head.appendChild(link);
    });


    const loadScript = (src) => new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src;
      if (/^https?:\/\//i.test(src)) {
        s.crossOrigin = 'anonymous';
      }
      s.onload = () => resolve(true);
      s.onerror = () => reject(new Error('script load failed: ' + src));
      document.head.appendChild(s);
    });

    function readSources() {
      try {
        const raw = localStorage.getItem(SOURCE_STORAGE_KEY);
        const parsed = raw ? { ...defaults, ...JSON.parse(raw) } : { ...defaults };
        if (!allowLocal && parsed.gui === 'local') {
          return { ...parsed, gui: 'stable' };
        }
        return parsed;
      } catch {
        return { ...defaults };
      }
    }

    function writeSources(next) {
      try {
        localStorage.setItem(SOURCE_STORAGE_KEY, JSON.stringify(next));
      } catch {}
    }

    function showLocalPrompt() {
      if (localPrompt) localPrompt.classList.add('visible');
      if (localEdit) localEdit.classList.remove('visible');
    }

    function hideLocalPrompt() {
      if (localPrompt) localPrompt.classList.remove('visible');
      if (localEdit) localEdit.classList.remove('visible');
    }

    function showLocalEditor() {
      if (localEdit) localEdit.classList.add('visible');
      if (localPrompt) localPrompt.classList.remove('visible');
      const current = readLocalPaths();
      if (localCssInput) localCssInput.value = current.css || '';
      if (localJsInput) localJsInput.value = current.js || '';
    }

    function readCollapsedState() {
      try {
        return localStorage.getItem(COLLAPSE_STORAGE_KEY) === 'true';
      } catch {
        return false;
      }
    }

    function writeCollapsedState(isCollapsed) {
      try {
        localStorage.setItem(COLLAPSE_STORAGE_KEY, String(isCollapsed));
      } catch {}
    }

    function readInspectorState() {
      try {
        return localStorage.getItem(INSPECTOR_STORAGE_KEY) === 'true';
      } catch {
        return false;
      }
    }

    function writeInspectorState(enabled) {
      try {
        localStorage.setItem(INSPECTOR_STORAGE_KEY, String(enabled));
      } catch {}
    }

    function syncCollapseUi() {
      const isCollapsed = document.body.classList.contains('runtime-collapsed');
      if (toggleButton) {
        toggleButton.textContent = '×';
        toggleButton.setAttribute('aria-label', 'Close runtime controls');
      }
    }

    function toggleCollapsedState() {
      const isCollapsed = !document.body.classList.contains('runtime-collapsed');
      document.body.classList.toggle('runtime-collapsed', isCollapsed);
      writeCollapsedState(isCollapsed);
      syncCollapseUi();
      rerender();
    }

    window.__guiToggleRuntimeControls = toggleCollapsedState;

    let inspectorEnabled = readInspectorState();
    let adminViewEnabled = readAdminViewState();

    function readAdminViewState() {
      try {
        return localStorage.getItem(ADMIN_VIEW_STORAGE_KEY) === 'true';
      } catch {
        return false;
      }
    }

    function setAdminViewEnabled(next, options = { persist: true, dispatch: true }) {
      adminViewEnabled = Boolean(next);
      if (options.persist) {
        try {
          localStorage.setItem(ADMIN_VIEW_STORAGE_KEY, String(adminViewEnabled));
        } catch {}
      }
      if (options.dispatch) {
        window.dispatchEvent(
          new CustomEvent('this.gui:adminView:set', { detail: { enabled: adminViewEnabled } })
        );
      }
      rerender();
    }

    function toggleAdminView() {
      if (window.__guiToggleAdminView && window.__guiToggleAdminView !== toggleAdminView) {
        window.__guiToggleAdminView();
        return;
      }
      setAdminViewEnabled(!adminViewEnabled);
    }

    window.__guiToggleAdminView = toggleAdminView;
    function setInspectorEnabled(next, options = { persist: true, dispatch: true }) {
      inspectorEnabled = Boolean(next);
      if (options.persist) writeInspectorState(inspectorEnabled);
      if (options.dispatch) {
        window.dispatchEvent(new CustomEvent('this.gui:inspector:set', { detail: { enabled: inspectorEnabled } }));
      }
      rerender();
    }
    function toggleInspector() {
      setInspectorEnabled(!inspectorEnabled);
    }
    window.__guiToggleInspector = toggleInspector;

    window.addEventListener('this.gui:inspector:set', (ev) => {
      const detail = ev && ev.detail ? ev.detail : {};
      if (typeof detail.enabled === 'boolean' && detail.enabled !== inspectorEnabled) {
        setInspectorEnabled(detail.enabled, { persist: true, dispatch: false });
      }
    });

    window.addEventListener('this.gui:inspector:changed', (ev) => {
      const detail = ev && ev.detail ? ev.detail : {};
      if (typeof detail.enabled === 'boolean') {
        inspectorEnabled = detail.enabled;
        writeInspectorState(inspectorEnabled);
        rerender();
      }
    });

    window.addEventListener('this.gui:adminView:changed', (ev) => {
      const detail = ev && ev.detail ? ev.detail : {};
      if (typeof detail.enabled === 'boolean') {
        adminViewEnabled = detail.enabled;
      } else {
        adminViewEnabled = readAdminViewState();
      }
      rerender();
    });

    const sources = readSources();
    if (guiSelect) {
      guiSelect.value = sources.gui || defaults.gui;
      if (!allowLocal) {
        const localOption = guiSelect.querySelector('option[value="local"]');
        if (localOption) {
          localOption.disabled = true;
          localOption.textContent = 'Local (file only)';
        }
        if (sources.gui === 'local') {
          guiSelect.value = 'stable';
          writeSources({ ...sources, gui: 'stable' });
        }
      }
    }
    bindToggle();
    if (readCollapsedState()) {
      document.body.classList.add('runtime-collapsed');
    }
    syncCollapseUi();
    if (toggleButton) {
      toggleButton.addEventListener('click', toggleCollapsedState);
    }
    window.addEventListener('storage', (ev) => {
      if (ev.key !== ADMIN_VIEW_STORAGE_KEY) return;
      adminViewEnabled = readAdminViewState();
      rerender();
    });

    if (localSkip) {
      localSkip.addEventListener('click', () => {
        hideLocalPrompt();
        if (guiSelect) guiSelect.value = 'stable';
        writeSources({ ...sources, gui: 'stable' });
        location.reload();
      });
    }
    if (localEditBtn) {
      localEditBtn.addEventListener('click', () => {
        showLocalEditor();
      });
    }
    if (localCancel) {
      localCancel.addEventListener('click', () => {
        hideLocalPrompt();
      });
    }
    if (localSave) {
      localSave.addEventListener('click', () => {
        const next = {
          css: localCssInput && localCssInput.value ? String(localCssInput.value).trim() : LOCAL_CSS_DEFAULT,
          js: localJsInput && localJsInput.value ? String(localJsInput.value).trim() : LOCAL_JS_DEFAULT,
        };
        writeLocalPaths(next);
        if (guiSelect) guiSelect.value = 'local';
        writeSources({ ...sources, gui: 'local' });
        location.reload();
      });
    }

    async function attemptLoad(source) {
      const urls = resolveAssetUrls(source);
      setStatus('pending', urls);
      window.GUI_RUNTIME_INFO = {
        source,
        state: 'pending',
        css: urls.css,
        js: urls.js,
        version: undefined,
      };
      await loadStyle(urls.css);
      if (source === 'local') {
        if (!window.React) await loadScript(REACT_CDN);
        if (!window.ReactDOM) await loadScript(REACTDOM_CDN);
      }
      await loadScript(urls.js);
      const detectedVersion = (window.GUI && window.GUI.version) || undefined;
      window.GUI_LOAD_SOURCE = source === 'local' ? 'local' : `cdn:${source}`;
      document.documentElement.setAttribute('data-gui-source', window.GUI_LOAD_SOURCE);
      console.log(`[GUI] Loaded from: ${window.GUI_LOAD_SOURCE}`);
      setStatus('loaded', urls, detectedVersion);
      document.body.classList.add('runtime-ready');
      window.GUI_RUNTIME_INFO = {
        source,
        state: 'loaded',
        css: urls.css,
        js: urls.js,
        version: detectedVersion,
      };
      return source;
    }

    const chosen = (guiSelect && guiSelect.value) || defaults.gui;
    const fallbackOrder = chosen === 'local'
      ? ['local', 'stable', 'latest']
      : chosen === 'stable'
      ? ['stable', 'latest']
      : ['latest'];

    let loadedSource = null;
    for (const source of fallbackOrder) {
      try {
        loadedSource = await attemptLoad(source);
        break;
      } catch (e) {
        console.warn(`[GUI] Runtime load failed for ${source}.`, e);
        const urls = resolveAssetUrls(source);
        setStatus('notfound', urls);
        if (source === 'local' && chosen === 'local') {
          showLocalPrompt();
          return;
        }
      }
    }

    if (!loadedSource) {
      const urls = resolveAssetUrls(chosen);
      window.GUI_RUNTIME_INFO = {
        source: chosen,
        state: 'notfound',
        css: urls.css,
        js: urls.js,
        version: undefined,
      };
      console.error('[GUI] No runtime could be loaded.');
    } else if (guiSelect && guiSelect.value !== loadedSource) {
      guiSelect.value = loadedSource;
      writeSources({ ...sources, gui: loadedSource });
    }

    if (guiSelect) {
      guiSelect.addEventListener('change', (event) => {
        const value = event.target.value;
        const next = { ...sources, gui: value };
        writeSources(next);
        location.reload();
      });
    }

    const rootEl = document.getElementById('root');
    if (!rootEl) return;
    if (window.GUI && typeof window.GUI.bootstrap === 'function') {
      await window.GUI.bootstrap();
    }
    if (!window.GUI || typeof window.GUI.mount !== 'function') {
      throw new Error('GUI runtime missing: window.GUI.mount not found');
    }
    const GUI = window.GUI;
    // --- Version (direct) ------------------------------------------------------
    const VERSION_LABEL = GUI?.version || 'unknown';
    const runtimeInfo = window.GUI_RUNTIME_INFO || {};
    const runtimeSource =
      runtimeInfo.source === 'local'
        ? 'local'
        : runtimeInfo.source === 'latest'
        ? 'cdn latest'
        : 'cdn stable';
    const runtimeState =
      runtimeInfo.state === 'loaded'
        ? 'Loaded'
        : runtimeInfo.state === 'notfound'
        ? 'NotFound'
        : 'Pending';
    const runtimeCss = runtimeInfo.css || '-';
    const runtimeJs = runtimeInfo.js || '-';
    const runtimeDetail = [
      formatRuntimeDetail(runtimeInfo.version, runtimeCss),
      formatRuntimeDetail(runtimeInfo.version, runtimeJs),
    ];
    const HERO_HEIGHT = '45vh';
    const isHttpUrl = (value) => /^https?:\/\//i.test(String(value || ''));
    const versionLabel = String(VERSION_LABEL || 'unknown');
    const sourceLabel = String(runtimeSource || '');
    const sourceEmphasis = sourceLabel.includes('latest') ? 'latest' : sourceLabel || 'local';
    const sourcePrefix = sourceLabel.replace(sourceEmphasis, '').trim();
    try {
      document.title = VERSION_LABEL !== 'unknown'
        ? `this.GUI v${VERSION_LABEL} — Runtime`
        : `this.GUI (${VERSION_LABEL}) — Runtime`;
    } catch (e) {}
    const leftBarLogo =
      window.React && typeof window.React.createElement === 'function'
        ? window.React.createElement(
            'a',
            {
              href: 'https://neurons-me.github.io/GUI/',
              target: '_blank',
              rel: 'noopener noreferrer',
              title: 'GUI',
              'aria-label': 'GUI',
              className: 'gui-leftbar-logo',
            },
            window.React.createElement('img', {
              src: 'https://res.cloudinary.com/dkwnxf6gm/image/upload/v1760629119/this.gui.neurons.me_mkapde.png',
              alt: 'this.GUI',
              style: {
                width: '55px',
                height: '55px',
                objectFit: 'contain',
                display: 'block',
              },
            }),
            window.React.createElement('span', { className: 'gui-leftbar-logo-label' }, 'GUI')
          )
        : null;
    const leftBarFooterLogo =
      window.React && typeof window.React.createElement === 'function'
        ? window.React.createElement(
            'a',
            {
              href: 'https://neurons.me/',
              target: '_blank',
              rel: 'noopener noreferrer',
              title: 'neurons.me',
              'aria-label': 'neurons.me',
              className: 'gui-leftbar-footer-logo',
            },
            window.React.createElement('img', {
              src: 'https://neurons.me/media/neurons-grey.png',
              alt: 'neurons.me',
              style: {
                width: '49px',
                height: '49px',
                objectFit: 'contain',
                display: 'block',
              },
            })
          )
        : null;
    const leftBarThemeToggle =
      window.React && window.GUI && window.GUI.ThemeModeToggle && typeof window.React.createElement === 'function'
        ? window.React.createElement(window.GUI.ThemeModeToggle, {
            variant: 'minimal',
            show: 'icons',
            iconSize: 'small',
          })
        : null;
    const heroAvailable = Boolean(
      window.GUI &&
        (window.GUI.Hero ||
          (window.GUI.Molecules && window.GUI.Molecules.Hero) ||
          (window.GUI.molecules && window.GUI.molecules.Hero))
    );
    const heroSpec = heroAvailable
      ? {
          type: 'Hero',
          props: {
            height: HERO_HEIGHT,
            padding: 4,
            backgroundSrc: 'https://www.neurons.me/media/neurons.mp4',
            backgroundType: 'video',
            blur: 'medium',
            overlayColor: 'rgba(8, 14, 24, 0.55)',
            layout: 'flow',
            mode: 'left',
            contentMaxWidth: 640,
            contentPaddingBottom: 4,
            brand: {
              src: 'https://res.cloudinary.com/dkwnxf6gm/image/upload/v1760629119/this.gui.neurons.me_mkapde.png',
              alt: 'this.GUI',
              width: 220,
              maxWidth: '70vw'
            },
            header: 'this.GUI Runtime',
            subheader: 'Hero',
            subheaderVariant: 'overline',
            typography: 'Runtime overview and quick links for the GUI toolchain.'
          }
        }
      : null;
    let leftbarResizeObserver = null;
    let leftbarObserverTarget = null;
    function setLeftbarViewClass(view) {
      const root = document.documentElement;
      const isRail = view === 'rail';
      root.classList.toggle('gui-leftbar-rail', isRail);
      root.classList.toggle('gui-leftbar-expanded', !isRail);
    }
    function inferLeftbarView(sidebar) {
      if (!sidebar) return 'expanded';
      const width = Math.max(0, sidebar.getBoundingClientRect().width || 0);
      return width >= 120 ? 'expanded' : 'rail';
    }
    function attachLeftbarObserver() {
      const sidebar = document.querySelector('.LeftSidebar');
      if (!sidebar) {
        if (leftbarResizeObserver) {
          leftbarResizeObserver.disconnect();
          leftbarResizeObserver = null;
        }
        leftbarObserverTarget = null;
        setLeftbarViewClass('expanded');
        return;
      }
      if (sidebar === leftbarObserverTarget) return;
      leftbarObserverTarget = sidebar;
      if (leftbarResizeObserver) leftbarResizeObserver.disconnect();
      if (typeof ResizeObserver === 'undefined') {
        setLeftbarViewClass(inferLeftbarView(sidebar));
        return;
      }
      leftbarResizeObserver = new ResizeObserver(() => {
        setLeftbarViewClass(inferLeftbarView(sidebar));
      });
      leftbarResizeObserver.observe(sidebar);
      setLeftbarViewClass(inferLeftbarView(sidebar));
    }
    function installLeftbarViewObserver() {
      if (window.__guiLeftbarViewObserverInstalled) {
        attachLeftbarObserver();
        return;
      }
      window.__guiLeftbarViewObserverInstalled = true;
      attachLeftbarObserver();
      if (typeof MutationObserver === 'undefined') return;
      const mo = new MutationObserver(() => {
        attachLeftbarObserver();
      });
      mo.observe(document.body, { childList: true, subtree: true });
    }
    function openExternal(url) {
      if (!url) return;
      const win = window.open(url, '_blank', 'noopener,noreferrer');
      if (win) {
        try {
          win.opener = null;
        } catch (e) {}
        return;
      }
      try {
        window.location.href = url;
      } catch (e) {}
    }
    function buildSpec() {
      const runtimeCollapsed = document.body.classList.contains('runtime-collapsed');
      const leftBar = {
        initialView: 'rail',
        elements: [
          leftBarLogo ? { type: 'action', props: { element: leftBarLogo } } : null,
        ].filter(Boolean),
        footerElements: [
          leftBarThemeToggle
            ? { type: 'action', props: { label: 'Theme Mode', element: leftBarThemeToggle } }
            : null,
          {
            type: 'menu',
            props: {
              label: 'Settings',
              icon: 'settings',
              items: [
                {
                  label: adminViewEnabled ? 'Admin View · ON' : 'Admin View · OFF',
                  icon: adminViewEnabled ? 'visibility' : 'visibility_off',
                  onClick: () => window.__guiToggleAdminView && window.__guiToggleAdminView()
                },
                {
                  label: 'Themes',
                  icon: 'palette',
                  onClick: () => {
                    window.location.href = './themes.html';
                  }
                },
                {
                  label: inspectorEnabled ? 'Inspector · ON' : 'Inspector · OFF',
                  icon: inspectorEnabled ? 'code' : 'code_off',
                  onClick: () => window.__guiToggleInspector && window.__guiToggleInspector()
                },
                {
                  label: runtimeCollapsed ? 'Runtime Controls · Hidden' : 'Runtime Controls · Visible',
                  icon: runtimeCollapsed ? 'unfold_more' : 'unfold_less',
                  onClick: () => window.__guiToggleRuntimeControls && window.__guiToggleRuntimeControls()
                }
              ]
            }
          },
          leftBarFooterLogo ? { type: 'action', props: { element: leftBarFooterLogo } } : null
        ].filter(Boolean)
      };
      const rightBar = {
        initialView: 'rail',
        elements: [
          {
            type: 'action',
            props: {
              label: 'Exports',
              icon: 'schema',
              onClick: () => {
                window.location.href = './exports.html';
              }
            }
          },
          {
            type: 'action',
            props: {
              label: 'Storybook',
              icon: 'auto_stories',
              onClick: () => openExternal('https://neurons-me.github.io/GUI/docs/storybook/index.html')
            }
          },
          {
            type: 'action',
            props: {
              label: 'GitHub',
              icon: 'code',
              onClick: () => openExternal('https://github.com/neurons-me/this.GUI')
            }
          },
          {
            type: 'action',
            props: {
              label: 'npm',
              icon: 'package_2',
              onClick: () => openExternal('https://www.npmjs.com/package/this.gui')
            }
          }
        ]
      };
      return {
        type: 'Layout',
        props: { leftBar, rightBar },
        children: [
          {
            type: 'Page',
            props: { title: 'this.GUI — Runtime' },
            children: [
              heroSpec,
            {
              type: 'Box',
              props: {
                sx: {
                  mt: 2,
                  display: 'grid',
                  gridTemplateColumns: { xs: '1fr', md: '1fr 1fr' },
                  gap: 2,
                  alignItems: 'start',
                },
              },
              children: [
                {
                  type: 'Paper',
                  props: { sx: { p: 2, borderRadius: 2 } },
                  children: [
                    {
                      type: 'Typography',
                      props: {
                        variant: 'overline',
                        sx: { color: 'text.secondary', letterSpacing: '0.18em' },
                      },
                      children: ['Module'],
                    },
                    {
                      type: 'Typography',
                      props: { variant: 'h6', sx: { fontWeight: 700, mt: 0.5 } },
                      children: ['Runtime Assets'],
                    },
                    {
                      type: 'Typography',
                      props: {
                        variant: 'h1',
                        component: 'h1',
                        sx: { fontWeight: 900, letterSpacing: '-0.4px', mt: 0.5 },
                      },
                      children: ['.GUI'],
                    },
                    {
                      type: 'Typography',
                      props: { sx: { mt: 0.75, color: 'text.secondary' } },
                      children: [
                        'Version: ',
                        {
                          type: 'Box',
                          props: { component: 'span', sx: { fontWeight: 800, color: 'text.primary' } },
                          children: [versionLabel],
                        },
                        ' · ',
                        sourcePrefix ? `${sourcePrefix} ` : '',
                        {
                          type: 'Box',
                          props: { component: 'span', sx: { fontWeight: 800, color: 'text.primary' } },
                          children: [sourceEmphasis],
                        },
                        ' ',
                        {
                          type: 'Box',
                          props: {
                            component: 'span',
                            sx: {
                              ml: 0.5,
                              px: 0.75,
                              py: 0.1,
                              borderRadius: 999,
                              bgcolor: 'success.main',
                              color: 'success.contrastText',
                              fontSize: '0.7rem',
                              fontWeight: 800,
                              textTransform: 'uppercase',
                              letterSpacing: '0.04em',
                            },
                          },
                          children: [runtimeState],
                        },
                      ],
                    },
                    isHttpUrl(runtimeCss)
                      ? {
                          type: 'Typography',
                          props: {
                            component: 'a',
                            href: runtimeCss,
                            target: '_blank',
                            rel: 'noopener noreferrer',
                            sx: { color: 'text.secondary', display: 'block' },
                          },
                          children: [runtimeDetail[0]],
                        }
                      : { type: 'Typography', props: { sx: { color: 'text.secondary' } }, children: [runtimeDetail[0]] },
                    isHttpUrl(runtimeJs)
                      ? {
                          type: 'Typography',
                          props: {
                            component: 'a',
                            href: runtimeJs,
                            target: '_blank',
                            rel: 'noopener noreferrer',
                            sx: { color: 'text.secondary', display: 'block' },
                          },
                          children: [runtimeDetail[1]],
                        }
                      : { type: 'Typography', props: { sx: { color: 'text.secondary' } }, children: [runtimeDetail[1]] },
                    {
                      type: 'Box',
                      props: {
                        sx: {
                          mt: 1.5,
                          p: 1.5,
                          borderRadius: 2,
                          border: '1px solid',
                          borderColor: 'divider',
                          backgroundColor: 'action.hover',
                          display: 'flex',
                          flexDirection: 'column',
                          gap: 1,
                        },
                      },
                      children: [
                        {
                          type: 'Box',
                          props: {
                            sx: {
                              display: 'flex',
                              alignItems: 'center',
                              justifyContent: 'space-between',
                              gap: 1,
                              flexWrap: 'wrap',
                            },
                          },
                          children: [
                            {
                              type: 'Typography',
                              props: { variant: 'body2', sx: { fontWeight: 700 } },
                              children: ['Admin View'],
                            },
                            {
                              type: 'Button',
                              props: {
                                size: 'small',
                                variant: adminViewEnabled ? 'contained' : 'outlined',
                                color: adminViewEnabled ? 'success' : 'inherit',
                                onClick: () => window.__guiToggleAdminView && window.__guiToggleAdminView(),
                                'data-gui-inspector-control': true,
                                sx: { textTransform: 'uppercase', letterSpacing: '0.08em', fontWeight: 700 },
                              },
                              children: [adminViewEnabled ? 'ON' : 'OFF'],
                            },
                          ],
                        },
                        {
                          type: 'Box',
                          props: {
                            sx: {
                              display: 'flex',
                              alignItems: 'center',
                              justifyContent: 'space-between',
                              gap: 1,
                              flexWrap: 'wrap',
                            },
                          },
                          children: [
                            {
                              type: 'Typography',
                              props: { variant: 'body2', sx: { fontWeight: 700 } },
                              children: ['Component Inspector'],
                            },
                            {
                              type: 'Button',
                              props: {
                                size: 'small',
                                variant: inspectorEnabled ? 'contained' : 'outlined',
                                color: inspectorEnabled ? 'success' : 'inherit',
                                onClick: () => window.__guiToggleInspector && window.__guiToggleInspector(),
                                'data-gui-inspector-control': true,
                                sx: { textTransform: 'uppercase', letterSpacing: '0.08em', fontWeight: 700 },
                              },
                              children: [inspectorEnabled ? 'ON' : 'OFF'],
                            },
                          ],
                        },
                      ],
                    },
                  ],
                },
                {
                  type: 'Paper',
                  props: { sx: { p: 2, borderRadius: 2 } },
                  children: [
                    {
                      type: 'Typography',
                      props: {
                        variant: 'overline',
                        sx: { color: 'text.secondary', letterSpacing: '0.18em' },
                      },
                      children: ['Index'],
                    },
                    {
                      type: 'Typography',
                      props: { variant: 'h6', sx: { fontWeight: 700, mt: 0.5 } },
                      children: ['Content and Navigation'],
                    },
                    {
                      type: 'Box',
                      props: {
                        sx: {
                          mt: 1.25,
                          display: 'grid',
                          gridTemplateColumns: { xs: '1fr', sm: '1fr 1fr' },
                          gap: 1,
                        },
                      },
                      children: [
                        {
                          type: 'Box',
                          props: {
                            component: 'a',
                            href: 'https://neurons-me.github.io/GUI/docs/storybook/index.html',
                            target: '_blank',
                            rel: 'noopener noreferrer',
                            sx: {
                              display: 'flex',
                              flexDirection: 'column',
                              gap: 0.75,
                              p: 1.25,
                              borderRadius: 2,
                              border: '1px solid',
                              borderColor: 'divider',
                              textDecoration: 'none',
                              color: 'text.primary',
                              backgroundColor: 'action.hover',
                              transition: 'transform 140ms ease, border-color 140ms ease, background-color 140ms ease',
                              '&:hover': {
                                transform: 'translateY(-2px)',
                                borderColor: 'text.secondary',
                                backgroundColor: 'action.selected',
                              },
                            },
                          },
                          children: [
                            {
                              type: 'Box',
                              props: {
                                sx: { display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 1 },
                              },
                              children: [
                                {
                                  type: 'Typography',
                                  props: {
                                    variant: 'overline',
                                    sx: { color: 'text.secondary', letterSpacing: '0.12em' },
                                  },
                                  children: ['Component'],
                                },
                                {
                                  type: 'Typography',
                                  props: { component: 'span', sx: { fontSize: '2.6rem', lineHeight: 1 } },
                                  children: ['𓏞'],
                                },
                              ],
                            },
                            {
                              type: 'Typography',
                              props: { variant: 'subtitle1', sx: { fontWeight: 700 } },
                              children: ["Component's Storybook"],
                            },
                            {
                              type: 'Typography',
                              props: { variant: 'body2', sx: { color: 'text.secondary' } },
                              children: ['Open the components catalog'],
                            },
                          ],
                        },
                        {
                          type: 'Box',
                          props: {
                            component: 'a',
                            href: 'https://neurons-me.github.io/GUI/docs/storybook/index.html',
                            target: '_blank',
                            rel: 'noopener noreferrer',
                            sx: {
                              display: 'flex',
                              flexDirection: 'column',
                              gap: 0.75,
                              p: 1.25,
                              borderRadius: 2,
                              border: '1px solid',
                              borderColor: 'divider',
                              textDecoration: 'none',
                              color: 'text.primary',
                              backgroundColor: 'action.hover',
                              transition: 'transform 140ms ease, border-color 140ms ease, background-color 140ms ease',
                              '&:hover': {
                                transform: 'translateY(-2px)',
                                borderColor: 'text.secondary',
                                backgroundColor: 'action.selected',
                              },
                            },
                          },
                          children: [
                            {
                              type: 'Box',
                              props: {
                                sx: { display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 1 },
                              },
                              children: [
                                {
                                  type: 'Typography',
                                  props: {
                                    variant: 'overline',
                                    sx: { color: 'text.secondary', letterSpacing: '0.12em' },
                                  },
                                  children: ['Exports'],
                                },
                                {
                                  type: 'Typography',
                                  props: { component: 'span', sx: { fontSize: '2.6rem', lineHeight: 1 } },
                                  children: ['𓇼'],
                                },
                              ],
                            },
                            {
                              type: 'Typography',
                              props: { variant: 'subtitle1', sx: { fontWeight: 700 } },
                              children: ['Shapes and Forms'],
                            },
                            {
                              type: 'Typography',
                              props: { variant: 'body2', sx: { color: 'text.secondary' } },
                              children: ['atoms, molecules, components, widgets and more...'],
                            },
                          ],
                        },
                      ],
                    },
                  ],
                },
              ],
            },
            ],
          },
        ],
      };
    }

    function renderSpec() {
      const spec = buildSpec();
      GUI.mount(spec, '#root', { inspectorEnabled });
      installLeftbarViewObserver();
      window.dispatchEvent(
        new CustomEvent('this.gui:adminView:set', { detail: { enabled: adminViewEnabled } })
      );
      console.log('[GUI] ✅ Runtime mounted via GUI.mount');
    }
    rerender = renderSpec;

    try {
      renderSpec();
    } catch (err) {
      const msg = err && err.message ? err.message : String(err);
      rootEl.innerHTML =
        '<div style="font-family:ui-sans-serif,system-ui;padding:24px">❌ mount failed: ' +
        msg +
        '</div>';
    }
  })();
</script>
</body>
</html>
