<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>.GUI</title>
<link rel="icon" href="https://res.cloudinary.com/dkwnxf6gm/image/upload/v1761276578/this.gui.npm.png" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/this.gui@latest/dist/styles.css" crossorigin="anonymous" />
</head>
<body>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script>
  window.process = {
    env: {
      NODE_ENV: "production"
    }
  };
</script>
<script src="https://cdn.jsdelivr.net/npm/this.gui@latest/dist/this.gui.umd.js" crossorigin="anonymous"></script>
<script>
  (function () {
    const GUI = window.GUI;
    const rootEl = document.getElementById('root');
    if (!rootEl) return;
    if (!GUI) {
      rootEl.innerHTML =
        '<div style="font-family:ui-sans-serif,system-ui;padding:24px">❌ window.GUI not found</div>';
      return;
    }

    if (typeof GUI.mount !== 'function') {
      rootEl.innerHTML =
        '<div style="font-family:ui-sans-serif,system-ui;padding:24px">❌ window.GUI exists, but GUI.mount is missing</div>';
      return;
    }

    // --- Version (best-effort) -------------------------------------------------
    const GUI_VERSION =
      GUI?.version ||
      GUI?.VERSION ||
      GUI?.__version ||
      GUI?.__VERSION__ ||
      GUI?.default?.version ||
      GUI?.default?.VERSION ||
      null;

    const CDN_VERSION = (() => {
      try {
        const urls = [];
        document.querySelectorAll('script[src]').forEach((s) => urls.push(s.src));
        document.querySelectorAll('link[href]').forEach((l) => urls.push(l.href));
        for (const url of urls) {
          const m = url.match(/\/npm\/this\.gui@([^/]+)\//);
          if (m && m[1]) return m[1];
        }
      } catch (e) {}
      return null;
    })();

    const RESOLVED_VERSION =
      GUI_VERSION || (CDN_VERSION && CDN_VERSION !== 'latest' ? CDN_VERSION : null);

    let VERSION_LABEL = RESOLVED_VERSION
      ? RESOLVED_VERSION
      : CDN_VERSION === 'latest'
        ? 'latest'
        : 'unknown';

    try {
      document.title = RESOLVED_VERSION
        ? `this.GUI v${RESOLVED_VERSION} — Runtime`
        : `this.GUI (${VERSION_LABEL}) — Runtime`;
    } catch (e) {}

    const leftSidebarConfig = {
          initialView: 'rail',
          elements: [
            { type: 'link', props: { label: 'Home', icon: 'home', href: './index.html' } },
            { type: 'link', props: { label: '.GUI', icon: 'widgets', href: './npm/html/index.html' } },
            { type: 'link', props: { label: 'Themes', icon: 'palette', href: './npm/html/themes.html' } },
            { type: 'link', props: { label: 'Exports', icon: 'code', href: './npm/html/exports.html' } },
            {
              type: 'link',
              props: {
                label: 'Storybook',
                icon: 'auto_stories',
                href: 'https://neurons-me.github.io/storybook-static/',
              },
            },
            {
              type: 'link',
              props: {
                label: 'GitHub',
                icon: 'code',
                href: 'https://github.com/neurons-me/this.GUI',
              },
            },
            {
              type: 'link',
              props: {
                label: 'npm',
                icon: 'package_2',
                href: 'https://www.npmjs.com/package/this.gui',
              },
            },
          ],
        };


    // JSON spec rendered by GUI.mount
    const spec = {
      type: 'Layout',
      props: { leftSidebarConfig },
      children: [
        {
          type: 'Page',
          props: { title: 'this.GUI — Runtime' },
          children: [
            {
              type: 'Box',
              props: {
                sx: {
                  mt: 2,
                  display: 'grid',
                  gridTemplateColumns: { xs: '1fr', md: 'minmax(0, 1fr) minmax(0, 1fr)' },
                  gap: 2,
                  alignItems: 'start',
                },
              },
              children: [
                {
                  type: 'Box',
                  props: { sx: { minWidth: 0 } },
                  children: [
                    {
                      type: 'Paper',
                      props: { sx: { p: 2, borderRadius: 2, minWidth: 0 } },
                      children: [
                        {
                          type: 'Typography',
                          props: { variant: 'h4', sx: { fontWeight: 900, letterSpacing: '-0.4px' } },
                          children: ['Bootstrapping .GUI in HTML'],
                        },
                        {
                          type: 'Typography',
                          props: { variant: 'body2', sx: { mt: 1, opacity: 0.85 } },
                          children: [
                            'Copy and paste the full example code into any HTML file, then open it in your browser. '
                          ]
                        },
                        {
                          type: 'Typography',
                          props: { variant: 'body2', sx: { mt: 0.5, opacity: 0.9 } },
                          children: ['🌐 Just drop a <script> tag in an HTML file and mount an app.'],
                        },
                        {
                          type: 'Typography',
                          props: { variant: 'body2', sx: { mt: 1, opacity: 0.85 } },
                          children: ['Add this script to your HTML:'],
                        },
                        {
                          type: 'Box',
                          props: { sx: { minWidth: 0 } },
                          children: [
                            {
                              type: 'CodeBlock',
                              props: {
                                title: 'Bootstrap Script',
                                language: 'html',
                                variant: 'dark',
                                showLineNumbers: true,
                                wrapLongLines: true,
                                code: `<div id="root"></div>\n<script src="https://cdn.jsdelivr.net/npm/this.gui@latest/dist/this.gui.bootstrap.umd.js" crossorigin="anonymous"><\\/script>`,
                              },
                            },
                          ],
                        },
                        {
                          type: 'Typography',
                          props: { variant: 'body2', sx: { mt: 1, opacity: 0.85 } },
                          children: ['Then you can use the global window.GUI object on a a <script> tag:'],
                        },
                        {
                          type: 'Typography',
                          props: { variant: 'body2', sx: { mt: 0.5, opacity: 0.85 } },
                          children: ['Example:'],
                        },
                        {
                          type: 'Box',
                          props: { sx: { minWidth: 0 } },
                          children: [
                            {
                              type: 'CodeBlock',
                              props: {
                                title: 'Example',
                                language: 'js',
                                variant: 'dark',
                                showLineNumbers: true,
                                wrapLongLines: true,
                                code: `(async function () {\n  await window.GUI.bootstrap();\n  const root = document.getElementById('root');\n\n  const app = {\n    type: 'Page',\n    props: {\n      title: '.GUI Bootstrap',\n      subtitle: 'HTML setup.',\n    },\n  };\n\n  window.GUI.mount(app, root);\n})();\n`,
                              },
                            },
                          ],
                        },
                      ],
                    },
                  ],
                },
                {
                  type: 'Box',
                  props: { sx: { minWidth: 0 } },
                  children: [
                    {
                      type: 'CodeBlock',
                      props: {
                        title: 'bootstrap.html - Full Code Example.',
                        language: 'html',
                        variant: 'dark',
                        showLineNumbers: true,
                        wrapLongLines: true,
                        code: `<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" 
          content="width=device-width, 
          initial-scale=1.0" />
    <link 
    rel="icon" 
    href="https://res.cloudinary.com/dkwnxf6gm/image/upload/v1761276578/this.gui.npm.png"/>
    <title>.GUI — Bootstrap</title>
  </head>

  <body>
    <div id="root"></div>
    <!-- .GUI BOOTSTRAP -->
    <script src="../dist/this.gui.bootstrap.umd.js"><\\/script>
    <script>
  (async function () {
    await window.GUI.bootstrap();
    const GUI = window.GUI;
    const root = document.getElementById('root');
    const app = {
      type: 'Page',
        props: {
          title: '.GUI Bootstrap',
          subtitle: 'Single-script HTML Setup.',
          },
      children: [
          {
          type: 'Paper',
          props: { sx: { p: 2, borderRadius: 2, mt: 2 } },
          children: [
            {
              type: 'Typography',
              props: { variant: 'body1', sx: { fontWeight: 800 } },
              children: ['✅ window.GUI is ready'],
            }]}]
        };
        GUI.mount(app, root);
      })();
    <\\/script>
  </body>
</html>`,
                      },
                    },
                  ],
                },
              ],
            },
          ],
        },
      ],
    };

  
    try {
      GUI.mount(spec, '#root');
      console.log('[GUI] ✅ Runtime mounted via GUI.mount');
    } catch (err) {
      const msg = err && err.message ? err.message : String(err);
      rootEl.innerHTML =
        '<div style="font-family:ui-sans-serif,system-ui;padding:24px">❌ mount failed: ' +
        msg +
        '</div>';
    }
  })();
</script>
</body>
</html>
