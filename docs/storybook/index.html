<style>
  /* Asegura que el título .GUI aparezca junto al logo */
  .sidebar-header a {
    display: flex !important;
    align-items: center !important;
    gap: 8px !important;
  }
  .sidebar-header img {
    max-height: 55px !important;
    max-width: 89px !important;
  }
</style>
<link rel="icon" type="image/png" href="/favicon.ico" />
<link rel="stylesheet" href="/material-symbols.css" />

<link rel="stylesheet" href="/material-symbols.css" />
<style>
  /* Collapse groups by default in the left sidebar */
  [data-side="left"] [role="tree"] [role="group"] {
    display: none;
  }
  /* Keep the top-level list visible */
  [data-side="left"] [role="tree"] > [role="group"] {
    display: block;
  }
</style>
 

    <style>
      #storybook-root[hidden] {
        display: none !important;
      }
    </style>

    
  </head>
  <body>
    <div id="root"></div>

    
    <script>
      
        
          window['FEATURES'] = {
  "argTypeTargetsV7": true,
  "legacyDecoratorFileOrder": false,
  "disallowImplicitActionsInRenderV8": true,
  "viewport": true,
  "highlight": true,
  "controls": true,
  "interactions": true,
  "actions": true,
  "backgrounds": true,
  "outline": true,
  "measure": true
};
        
      
        
          window['REFS'] = {};
        
      
        
          window['LOGLEVEL'] = "info";
        
      
        
          window['DOCS_OPTIONS'] = {
  "defaultName": "Docs"
};
        
      
        
          window['CONFIG_TYPE'] = "PRODUCTION";
        
      
        
      
        
      
        
          window['TAGS_OPTIONS'] = {};
        
      
        
          window['STORYBOOK_BUILDER'] = "vite";
        
      
        
          window['STORYBOOK_FRAMEWORK'] = "react-vite";
        
      
        
          window['STORYBOOK_RENDERER'] = "react";
        
      
        
      
    </script>
